name: Build and Deploy Static Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build static site
      run: dotnet run --project ./src

    - name: Dump filesystem
      run: ls -R .

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: output
        destination_dir: . 
        enable_jekyll: false
    - name: Verify gh-pages content
      run: |
        echo "Cloning gh-pages branch to verify content..."
        git clone -b gh-pages --depth=1 https://github.com/Pp-4/Pp-4.github.io.git verify-gh-pages
        cd verify-gh-pages
        ls -R
